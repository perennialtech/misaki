[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project]
name = "misaki"
version = "0.10.0"
description = "G2P engine for TTS"
readme = "README.md"
authors = [
    { name = "hexgrad", email = "hello@hexgrad.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11, <3.15"
dependencies = [
    "addict>=2.4",
    "pip>=26.1", # Spacy needs pip within Python, uv lacks pip by default
    "regex>=2026.5",
]

[project.optional-dependencies]
en = ["en-core-web-sm", "num2words", "spacy<4", "spacy-curated-transformers", "phonemizer-fork", "espeakng-loader", "torch", "transformers"]
ja = ["fugashi", "jaconv", "mojimoji", "unidic", "pyopenjtalk"]
ko = [ "jamo", "mecab", "nltk"]
zh = ["jieba", "ordered-set", "pypinyin", "cn2an", "pypinyin-dict"]
ui = [
    "gradio>=6.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "black>=24.8.0",
    "isort>=5.13.2",
    "pytest>=8.3.5",
    "ruff>=0.15.20",
]
