[project]
name = "misaki"
dynamic = ["version"]
description = "G2P engine for TTS"
readme = "README.md"
authors = [
    { name = "hexgrad", email = "hello@hexgrad.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11, <3.15"
dependencies = [
    "regex>=2026.7",
]

[project.optional-dependencies]
en = [
    "num2words>=0.5",
    "numpy>=2.4",
    "spacy>=3.8,<4",
]

en-fallback = [
    "torch>=2.13",
    "transformers>=5.14",
]

espeak = [
    "espeakng-loader>=0.2",
    "phonemizer-fork>=3.3",
]

ja = [
    "fugashi[unidic-lite]>=1.5",
    "jaconv>=0.5",
    "mojimoji>=0.0",
    "pyopenjtalk>=0.4",
]

ko = [
    "jamo>=0.4",
    "python-mecab-ko>=1.3",
]

zh = [
    "cn2an>=0.5",
    "jieba>=0.42",
    "ordered-set>=4.1",
    "pypinyin>=0.55",
    "pypinyin-dict>=0.9",
]

multilingual = [
    "cn2an>=0.5",
    "fugashi[unidic-lite]>=1.5",
    "jaconv>=0.5",
    "jamo>=0.4",
    "jieba>=0.42",
    "mojimoji>=0.0",
    "num2words>=0.5",
    "numpy>=2.4",
    "ordered-set>=4.1",
    "pypinyin>=0.55",
    "pypinyin-dict>=0.9",
    "python-mecab-ko>=1.3",
    "spacy>=3.8,<4",
]

ui = [
    "gradio>=6.20",
]

[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "misaki/__init__.py"

[dependency-groups]
en-sm = [
    "en-core-web-sm==3.8.0",
]
en-trf = [
    "en-core-web-trf==3.8.0",
]
dev = [
    "basedpyright>=1.39",
    "black>=26.5",
    "isort>=8.0",
    "pytest>=9.1",
    "ruff>=0.15",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
