[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "misaki"
version = "0.10.0"
description = "G2P engine for TTS"
readme = "README.md"
authors = [
    { name = "hexgrad", email = "hello@hexgrad.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11, <3.15"
dependencies = [
    "addict>=2.4",
    "pip>=26.1", # Spacy needs pip within Python, uv lacks pip by default
    "regex>=2026.5",
]

[project.optional-dependencies]
en = ["num2words", "spacy<4", "spacy-curated-transformers", "phonemizer-fork", "espeakng-loader", "torch", "transformers"]
ja = ["fugashi", "jaconv", "mojimoji", "unidic", "pyopenjtalk"]
ko = ["jamo", "nltk"]
zh = ["jieba", "ordered-set", "pypinyin", "cn2an", "pypinyin-dict"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "black>=24.8.0",
    "isort>=5.13.2",
    "pytest>=8.3.5",
    "ruff>=0.15.20",
]
